<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>徐天锐 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --primary: #6366F1;
            --primary-light: #A5B4FC;
            --primary-dark: #4F46E5;
            --accent: #F59E0B;
            --accent-light: #FCD34D;
            --text: #1E293B;
            --text-secondary: #475569;
            --text-muted: #64748B;
            --bg: #F8FAFC;
            --bg-card: rgba(255, 255, 255, 0.72);
            --border: rgba(255, 255, 255, 0.55);
            --shadow: 0 8px 32px rgba(99, 102, 241, .10);
            --shadow-hover: 0 16px 48px rgba(99, 102, 241, .18);
            --radius: 24px;
            --radius-sm: 16px;
            --transition: 0.25s cubic-bezier(.4, 0, .2, 1);
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            --max-width: 1160px;
            --nav-height: 86px;
        }
        [data-theme="dark"] {
            --primary: #818CF8;
            --primary-light: #A5B4FC;
            --primary-dark: #6366F1;
            --accent: #FBBF24;
            --accent-light: #FCD34D;
            --bg: #0F172A;
            --bg-card: rgba(30, 41, 59, 0.68);
            --text: #F1F5F9;
            --text-secondary: #CBD5E1;
            --text-muted: #94A3B8;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 8px 32px rgba(0, 0, 0, .35);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, .50);
        }
        html {
            scroll-behavior: smooth;
            -webkit-text-size-adjust: 100%;
        }
        body {
            font-family: var(--font);
            color: var(--text);
            line-height: 1.65;
            padding-top: var(--nav-height);
            min-height: 100vh;
            background:
                radial-gradient(circle at 0% 0%, rgba(165, 180, 252, .38) 0%, transparent 42%),
                radial-gradient(circle at 100% 0%, rgba(167, 243, 208, .32) 0%, transparent 48%),
                radial-gradient(circle at 100% 100%, rgba(253, 230, 138, .30) 0%, transparent 42%),
                radial-gradient(circle at 0% 100%, rgba(196, 181, 253, .28) 0%, transparent 48%),
                linear-gradient(135deg, #f8fafc 0%, #eef2ff 40%, #f0fdf4 100%);
            background-attachment: fixed;
            transition: color var(--transition);
        }
        [data-theme="dark"] body {
            background:
                radial-gradient(circle at 0% 0%, rgba(79, 70, 229, .28) 0%, transparent 45%),
                radial-gradient(circle at 100% 0%, rgba(16, 185, 129, .16) 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, .15) 0%, transparent 40%),
                radial-gradient(circle at 0% 100%, rgba(124, 58, 237, .22) 0%, transparent 45%),
                linear-gradient(135deg, #0f172a 0%, #1e1b4b 45%, #0f172a 100%);
            background-attachment: fixed;
        }
        a {
            color: var(--primary);
            text-decoration: none;
        }
        a:hover {
            color: var(--primary-dark);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }
        /* ===== Utils ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }
        .section {
            padding: 56px 0 48px;
            opacity: 0;
            transform: translateY(24px);
            animation: fadeUp .6s ease forwards;
            scroll-margin-top: calc(var(--nav-height) + 16px);
        }
        .section-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 28px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }
        .section-title .badge {
            font-size: .72rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            padding: 0;
            border-radius: 0;
        }
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        /* ===== Navbar ===== */
        .navbar {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            right: auto;
            height: auto;
            padding: 8px 10px 8px 18px;
            background: var(--bg-card);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 50px;
            box-shadow: var(--shadow);
            z-index: 1000;
            max-width: min(960px, calc(100% - 32px));
            width: 100%;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 0;
        }
        .navbar-brand {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .navbar-brand .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            margin-left: 4px;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .4;
                transform: scale(.7);
            }
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
            flex-wrap: wrap;
            justify-content: center;
        }
        .nav-links a {
            font-size: .84rem;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 7px 14px;
            border-radius: 40px;
            transition: all var(--transition);
            position: relative;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: var(--text);
        }
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-left: 8px;
        }
        .nav-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: background var(--transition), color var(--transition), transform .15s;
        }
        .nav-actions button:hover {
            background: rgba(99, 102, 241, .10);
            color: var(--primary);
            transform: scale(1.04);
        }
        .nav-actions button:active {
            transform: scale(.94);
        }
        .nav-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            color: var(--text);
            cursor: pointer;
            padding: 4px 8px;
        }
        /* ===== Hero ===== */
        .hero {
            padding: 56px 0 36px;
            position: relative;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 56px;
            align-items: center;
        }
        .hero-content .hello {
            font-size: .82rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .hero-content .hello::before {
            content: '';
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent);
        }
        .hero-content h1 {
            font-size: 3.2rem;
            font-weight: 800;
            letter-spacing: -0.04em;
            line-height: 1.05;
            margin-bottom: 12px;
            color: var(--text);
        }
        .hero-content h1 .highlight {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-subtitle {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 16px;
        }
        .hero-desc {
            font-size: 1rem;
            color: var(--text-secondary);
            max-width: 520px;
            line-height: 1.75;
            margin-bottom: 24px;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 28px;
        }
        .hero-tags .tag {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(99, 102, 241, .22);
            padding: 5px 16px;
            border-radius: 40px;
            font-size: .82rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .hero-tags .tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, .08);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, .12);
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: .9rem;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all var(--transition);
            text-decoration: none;
            background: rgba(255, 255, 255, 0.55);
            color: var(--text);
        }
        .btn-primary {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
            box-shadow: 0 4px 16px rgba(30, 41, 59, .18);
        }
        .btn-primary:hover {
            background: #334155;
            border-color: #334155;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30, 41, 59, .25);
        }
        .btn-outline {
            background: rgba(255, 255, 255, 0.45);
            border-color: rgba(99, 102, 241, .22);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, .08);
            transform: translateY(-2px);
        }
        [data-theme="dark"] .btn-primary {
            background: #F1F5F9;
            color: #0F172A;
            border-color: #F1F5F9;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
        }
        [data-theme="dark"] .btn-primary:hover {
            background: #E2E8F0;
            border-color: #E2E8F0;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .35);
        }
        [data-theme="dark"] .btn-outline {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-secondary);
        }
        [data-theme="dark"] .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, .12);
        }
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 420px;
        }
        .hero-avatar {
            width: 260px;
            height: 340px;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, rgba(99, 102, 241, .10), rgba(245, 158, 11, .10));
            border: 2px solid rgba(255, 255, 255, .75);
            box-shadow:
                0 8px 32px rgba(99, 102, 241, .12),
                0 24px 70px rgba(99, 102, 241, .18),
                inset 0 0 0 1px rgba(255, 255, 255, .35);
            transition: all var(--transition);
        }
        .hero-avatar:hover {
            transform: translateY(-4px) scale(1.01);
            box-shadow:
                0 12px 40px rgba(99, 102, 241, .18),
                0 32px 90px rgba(99, 102, 241, .22),
                inset 0 0 0 1px rgba(255, 255, 255, .5);
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 8%;
            display: block;
            transition: transform .6s cubic-bezier(.4, 0, .2, 1);
        }
        .hero-avatar:hover img {
            transform: scale(1.03);
        }
        .hero-avatar::before,
        .hero-avatar::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            pointer-events: none;
        }
        .hero-avatar::before {
            width: 360px;
            height: 360px;
            background: linear-gradient(135deg, rgba(167, 243, 208, .42), rgba(196, 181, 253, .32));
            filter: blur(52px);
            top: -60px;
            right: -60px;
        }
        .hero-avatar::after {
            width: 240px;
            height: 240px;
            background: linear-gradient(135deg, rgba(253, 230, 138, .48), rgba(245, 158, 11, .28));
            filter: blur(40px);
            bottom: -50px;
            left: -50px;
        }
        .hero-avatar .avatar-glow {
            position: absolute;
            inset: 0;
            border-radius: 32px;
            box-shadow: inset 0 0 60px rgba(255, 255, 255, .25);
            pointer-events: none;
            z-index: 1;
        }
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-top: 32px;
            max-width: 520px;
        }
        .hero-stats .stat {
            background: var(--bg-card);
            padding: 14px 16px;
            border-radius: var(--radius-sm);
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .hero-stats .stat .num {
            font-size: 1.45rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
        }
        .hero-stats .stat .label {
            font-size: .72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        /* ===== Highlights ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 18px;
        }
        .highlight-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition);
            display: flex;
            align-items: flex-start;
            gap: 14px;
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 102, 241, .35);
        }
        .highlight-card .icon {
            font-size: 1.6rem;
            flex-shrink: 0;
            margin-top: 2px;
            width: 40px;
            text-align: center;
        }
        .highlight-card .content .num {
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--primary-dark);
        }
        .highlight-card .content .desc {
            font-size: .88rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }
        /* ===== Tabs ===== */
        .tabs-wrapper {
            margin-top: 8px;
        }
        .tabs-nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--bg-card);
            border-radius: 50px;
            padding: 6px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 9px 20px;
            font-size: .88rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 40px;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .tabs-nav button:hover {
            color: var(--text);
            background: rgba(99, 102, 241, .06);
        }
        .tabs-nav button[aria-selected="true"] {
            color: #fff;
            background: var(--text);
        }
        .tabs-nav button::after {
            display: none;
        }
        .tabs-panel {
            display: none;
            animation: fadeUp .35s ease forwards;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 28px 28px 32px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .tabs-panel[aria-hidden="false"] {
            display: block;
        }
        /* ===== Timeline ===== */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .timeline-item {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 24px;
            padding: 18px 22px;
            border-radius: var(--radius-sm);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .timeline-item:hover {
            background: rgba(255, 255, 255, 0.65);
            transform: translateX(4px);
        }
        .timeline-item .time {
            font-weight: 600;
            font-size: .86rem;
            color: var(--primary);
            white-space: nowrap;
        }
        .timeline-item .info h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text);
        }
        .timeline-item .info .sub {
            font-size: .87rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .timeline-item .info p {
            font-size: .88rem;
            color: var(--text-secondary);
            line-height: 1.65;
        }
        .timeline-item .info .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }
        .timeline-item .info .tags span {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(99, 102, 241, .18);
            padding: 2px 12px;
            border-radius: 40px;
            font-size: .72rem;
            color: var(--text-muted);
        }
        [data-theme="dark"] .timeline-item,
        [data-theme="dark"] .timeline-item .info .tags span,
        [data-theme="dark"] .hero-tags .tag,
        [data-theme="dark"] .project-card .tech span,
        [data-theme="dark"] .skill-items .skill-badge {
            background: rgba(255, 255, 255, 0.04);
        }
        [data-theme="dark"] .timeline-item:hover,
        [data-theme="dark"] .hero-tags .tag:hover,
        [data-theme="dark"] .skill-items .skill-badge:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        /* ===== Project Cards ===== */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }
        .project-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 24px 26px;
            transition: all var(--transition);
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(99, 102, 241, .35);
        }
        .project-card .title {
            font-size: 1.08rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .project-card .meta {
            font-size: .8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
        }
        .project-card .desc {
            font-size: .9rem;
            color: var(--text-secondary);
            line-height: 1.7;
            flex: 1;
        }
        .project-card .tech {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 16px 0 12px;
        }
        .project-card .tech span {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(99, 102, 241, .18);
            padding: 2px 14px;
            border-radius: 40px;
            font-size: .72rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .project-card .result {
            font-size: .86rem;
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* ===== Skills ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .skill-group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 20px 22px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition);
        }
        .skill-group:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .skill-group .group-title {
            font-weight: 700;
            font-size: .9rem;
            color: var(--text);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .skill-group .group-title .emoji {
            font-size: 1.2rem;
        }
        .skill-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .skill-items .skill-badge {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(99, 102, 241, .18);
            padding: 4px 16px;
            border-radius: 40px;
            font-size: .8rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
        }
        .skill-items .skill-badge:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(99, 102, 241, .08);
        }
        /* ===== Education & Certs ===== */
        .edu-cert-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        .edu-card,
        .cert-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 24px 28px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all var(--transition);
        }
        .edu-card:hover,
        .cert-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }
        .edu-card h4,
        .cert-card h4 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }
        .edu-card .sub,
        .cert-card .sub {
            font-size: .87rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .edu-card .detail,
        .cert-card .detail {
            font-size: .87rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }
        .cert-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .cert-list li {
            list-style: none;
            font-size: .88rem;
            color: var(--text-secondary);
            padding: 5px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .cert-list li:last-child {
            border-bottom: none;
        }
        .cert-list li .badge {
            background: var(--text);
            color: #fff;
            font-size: .6rem;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 600;
            letter-spacing: 0.3px;
            flex-shrink: 0;
        }
        /* ===== Footer ===== */
        .footer {
            padding: 28px 0 36px;
            margin-top: 16px;
            scroll-margin-top: calc(var(--nav-height) + 16px);
            text-align: center;
            font-size: .82rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .footer .update {
            font-size: .72rem;
        }
        /* ===== Back to Top ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: var(--shadow);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all var(--transition);
            opacity: 0;
            transform: scale(.8);
            pointer-events: none;
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .back-top.visible {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
        .back-top:hover {
            transform: scale(1.08) translateY(-3px);
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        /* ===== Print ===== */
        @media print {
            .navbar,
            .nav-actions,
            .back-top,
            .btn {
                display: none !important;
            }
            body {
                padding-top: 0 !important;
                background: #fff !important;
                color: #000 !important;
            }
            .section {
                padding: 24px 0 !important;
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
            }
            .container {
                max-width: 100% !important;
                padding: 0 20px !important;
            }
            .hero-grid {
                grid-template-columns: 1.2fr .8fr !important;
                gap: 32px !important;
                align-items: center !important;
            }
            .hero-visual {
                min-height: auto !important;
                display: flex !important;
            }
            .hero-avatar {
                width: 160px !important;
                height: 210px !important;
                border-radius: 20px !important;
                border: 1px solid #ddd !important;
                box-shadow: none !important;
                background: #fff !important;
            }
            .hero-avatar .avatar-glow {
                display: none !important;
            }
            .hero-avatar::before,
            .hero-avatar::after {
                display: none !important;
            }
            .hero-content h1 {
                font-size: 2.4rem !important;
            }
            .hero-subtitle {
                color: #4F46E5 !important;
            }
            .tabs-panel {
                display: block !important;
                border: 1px solid #ddd !important;
                margin-bottom: 16px !important;
                padding: 16px !important;
                box-shadow: none !important;
                background: #fff !important;
            }
            .tabs-nav {
                display: none !important;
            }
            .tabs-panel[aria-hidden="true"] {
                display: block !important;
            }
            .project-grid {
                grid-template-columns: 1fr 1fr !important;
            }
            .edu-cert-grid {
                grid-template-columns: 1fr 1fr !important;
            }
            .highlights-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
            .skills-grid {
                grid-template-columns: repeat(2, 1fr) !important;
            }
            .timeline-item,
            .project-card,
            .skill-group,
            .edu-card,
            .cert-card,
            .highlight-card {
                break-inside: avoid;
                page-break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #ddd !important;
                background: #fff !important;
            }
            * {
                animation: none !important;
                transition: none !important;
                transform: none !important;
            }
            .section-title::after {
                background: #ddd !important;
            }
            .hero-stats .stat .num,
            .hero-content h1 .highlight {
                -webkit-text-fill-color: #000 !important;
                color: #000 !important;
                background: none !important;
                -webkit-background-clip: border-box !important;
                background-clip: border-box !important;
            }
            .hero-stats .stat,
            .hero-tags .tag,
            .btn-outline {
                background: #fff !important;
                border: 1px solid #ddd !important;
            }
        }
        /* ===== Responsive ===== */
        @media (max-width: 992px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 40px;
            }
            .hero-desc {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .hero-tags {
                justify-content: center;
            }
            .hero-actions {
                justify-content: center;
            }
            .hero-stats {
                max-width: 100%;
                margin-left: auto;
                margin-right: auto;
            }
            .hero-visual {
                min-height: 340px;
            }
            .hero-avatar {
                width: 220px;
                height: 290px;
            }
            .hero-avatar::before {
                width: 300px;
                height: 300px;
            }
            .hero-avatar::after {
                width: 200px;
                height: 200px;
            }
            .edu-cert-grid {
                grid-template-columns: 1fr;
            }
            :root {
                --nav-height: 78px;
            }
        }
        @media (max-width: 768px) {
            .navbar {
                padding: 6px 8px 6px 14px;
                top: 10px;
                max-width: calc(100% - 24px);
            }
            .nav-links {
                display: none;
                flex-direction: column;
                width: 100%;
                padding: 12px 0 16px;
                background: var(--bg-card);
                border-radius: var(--radius-sm);
                border: 1px solid var(--border);
                box-shadow: var(--shadow);
                position: absolute;
                top: calc(100% + 10px);
                left: 0;
                right: 0;
                gap: 2px;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links a {
                padding: 10px 20px;
                width: 100%;
                border-radius: 0;
            }
            .nav-toggle {
                display: block;
            }
            .navbar .container {
                flex-wrap: wrap;
            }
            .nav-actions {
                margin-left: auto;
            }
            .timeline-item {
                grid-template-columns: 1fr;
                gap: 4px;
            }
            .timeline-item .time {
                font-size: .78rem;
            }
            .project-grid {
                grid-template-columns: 1fr;
            }
            .highlights-grid {
                grid-template-columns: 1fr 1fr;
            }
            .skills-grid {
                grid-template-columns: 1fr 1fr;
            }
            .hero-content h1 {
                font-size: 2.4rem;
            }
            .section-title {
                font-size: 1.35rem;
            }
            .tabs-panel {
                padding: 18px 16px 22px;
            }
            .tabs-nav {
                border-radius: var(--radius-sm);
            }
        }
        @media (max-width: 480px) {
            .highlights-grid {
                grid-template-columns: 1fr;
            }
            .skills-grid {
                grid-template-columns: 1fr;
            }
            .hero-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 8px;
            }
            .hero-stats .stat {
                padding: 10px 8px;
            }
            .hero-stats .stat .num {
                font-size: 1.1rem;
            }
            .container {
                padding: 0 16px;
            }
            .hero-content h1 {
                font-size: 2rem;
            }
            .hero-subtitle {
                font-size: 1.05rem;
            }
            .tabs-nav button {
                padding: 8px 14px;
                font-size: .8rem;
            }
            .btn {
                padding: 10px 20px;
                font-size: .85rem;
            }
            .hero-avatar {
                width: 180px;
                height: 240px;
                border-radius: 24px;
            }
            .hero-avatar .avatar-glow {
                border-radius: 24px;
            }
        }
        /* ===== Reduced Motion ===== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .hero-avatar .ring {
                animation: none !important;
            }
            .section {
                opacity: 1 !important;
                transform: none !important;
                animation: none !important;
            }
        }
        /* ===== Copy toast ===== */
        .toast {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 10px 28px;
            border-radius: 40px;
            font-size: .88rem;
            font-weight: 500;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .25);
            opacity: 0;
            transition: opacity .3s, transform .3s;
            pointer-events: none;
            z-index: 9999;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

        function $(sel, ctx = document) { return ctx.querySelector(sel); }

        function $$(sel, ctx = document) { return [...ctx.querySelectorAll(sel)]; }

        function create(tag, attrs = {}, children = []) {
            const el = document.createElement(tag);
            Object.entries(attrs).forEach(([k, v]) => {
                if (k === 'className') el.className = v;
                else if (k === 'textContent') el.textContent = v;
                else if (k === 'innerHTML') el.innerHTML = v;
                else if (k === 'aria') Object.entries(v).forEach(([ak, av]) => el.setAttribute(`aria-${ak}`, av));
                else el.setAttribute(k, v);
            });
            children.forEach(c => {
                if (typeof c === 'string') el.appendChild(document.createTextNode(c));
                else if (c) el.appendChild(c);
            });
            return el;
        }

        function renderTabs(container, tabsData, panelRenderer) {
            const wrapper = create('div', { className: 'tabs-wrapper' });
            const nav = create('div', { className: 'tabs-nav', role: 'tablist' });
            const panels = create('div', { className: 'tabs-panels' });

            tabsData.forEach((tab, idx) => {
                const btn = create('button', {
                    role: 'tab',
                    id: `tab-${tab.id}`,
                    'aria-controls': `panel-${tab.id}`,
                    'aria-selected': idx === 0 ? 'true' : 'false',
                    tabindex: idx === 0 ? 0 : -1,
                    textContent: tab.label,
                    className: idx === 0 ? '' : ''
                });
                nav.appendChild(btn);

                const panel = create('div', {
                    role: 'tabpanel',
                    id: `panel-${tab.id}`,
                    'aria-labelledby': `tab-${tab.id}`,
                    'aria-hidden': idx === 0 ? 'false' : 'true',
                    className: 'tabs-panel'
                });
                const content = panelRenderer(tab);
                panel.appendChild(content);
                panels.appendChild(panel);

                btn.addEventListener('click', () => activateTab(nav, panels, tab.id));
                btn.addEventListener('keydown', (e) => {
                    const btns = $$('button[role="tab"]', nav);
                    const idx2 = btns.indexOf(btn);
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        const next = btns[(idx2 + 1) % btns.length];
                        if (next) next.click();
                        next?.focus();
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        const prev = btns[(idx2 - 1 + btns.length) % btns.length];
                        if (prev) prev.click();
                        prev?.focus();
                    }
                });
            });

            wrapper.appendChild(nav);
            wrapper.appendChild(panels);
            container.appendChild(wrapper);

            function activateTab(navEl, panelsEl, id) {
                $$('button[role="tab"]', navEl).forEach(b => {
                    b.setAttribute('aria-selected', b.id === `tab-${id}`);
                    b.tabIndex = b.id === `tab-${id}` ? 0 : -1;
                });
                $$('[role="tabpanel"]', panelsEl).forEach(p => {
                    p.setAttribute('aria-hidden', p.id !== `panel-${id}`);
                });
            }
        }

            });
            backTop.addEventListener('click', () => {
                try {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (err) {
                    document.documentElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });

            // ---- Nav Toggle (mobile) ----
            const navToggle = $('#navToggle');
            const navLinks = $('#navLinks');
            navToggle.addEventListener('click', () => {
                const open = navLinks.classList.toggle('open');
                navToggle.setAttribute('aria-expanded', open);
                navToggle.textContent = open ? '✕' : '☰';
            });

            // ---- Smooth anchor scroll (robust across preview iframes) ----
            const navbar = $('.navbar');
            const getNavOffset = () => Math.round(navbar.getBoundingClientRect().height + 16);
            const scrollToTarget = (href) => {
                if (!href || href === '#') return false;
                const target = document.getElementById(href.slice(1));
                if (!target) return false;
                // scrollIntoView 会驱动所有嵌套滚动容器（含外层预览容器）一起滚动，
                // 配合 CSS 的 scroll-margin-top 自动避开悬浮导航栏；失败再回退 window.scrollTo
                try {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } catch (err) {
                    const top = target.getBoundingClientRect().top + window.pageYOffset - getNavOffset();
                    window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
                }
                return true;
            };
            $$('a[href^="#"]').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    const href = a.getAttribute('href');
                    if (scrollToTarget(href) && a.closest('#navLinks')) {
                        navLinks.classList.remove('open');
                        navToggle.setAttribute('aria-expanded', 'false');
                        navToggle.textContent = '☰';
                    }
                });
            });

            // ---- Nav highlight on scroll ----

                let current = '';
                const offset = getNavOffset() + 60;

                });
                navAnchors.forEach(a => {

                });
            };
